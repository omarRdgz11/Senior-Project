services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fire-db
    restart: unless-stopped
    # ports: []  # Use docker-compose.dev.yml to expose locally
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10


  adminer:
    image: adminer:latest
    container_name: fire-adminer
    restart: unless-stopped
    depends_on:
      - db
    # ports: []  # Use docker-compose.dev.yml to expose locally
    environment:

      ADMINER_DEFAULT_SERVER: db

  # Redis broker/result backend for Celery
  redis:
    image: redis:7-alpine
    container_name: fire-redis
    restart: unless-stopped
    # ports: []  # Use docker-compose.dev.yml to expose locally

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fire-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER: "1"
    # Mount ONLY the data folder into the exact path the app reads
    volumes:
      - ./backend/data:/app/backend/data:ro
    # ports: []  # Use docker-compose.dev.yml to expose locally
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery worker for background jobs (data ingest, etc.)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fire-celery-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER: "1"
    # If your tasks need to read the same data folder, mount it too
    volumes:
      - ./backend/data:/app/backend/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      celery -A app.celery_app.celery worker
      --loglevel=info

  # Celery beat for scheduled tasks (daily ingest)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fire-celery-beat
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER: "1"
    volumes:
      - ./backend/data:/app/backend/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      celery -A app.celery_app.celery beat
      --loglevel=info

  frontend:
    image: node:20-alpine
    container_name: fire-frontend
    working_dir: /usr/src/app
    environment:
      DOCKER: "1"
    volumes:
      - ./frontend:/usr/src/app
    command: sh -c "npm install && npm run dev -- --host"
    # ports: []  # Use docker-compose.dev.yml to expose locally
    depends_on:
      - backend


volumes:
  db_data:
