services:
  # In prod, don't expose DB directly to the internet
  db:
    ports: []

  # Don't expose Redis either
  redis:
    ports: []

  # Backend should only be reachable internally by Caddy
  backend:
    env_file: .env.production
    ports: []
    volumes:
      - ./backend/data:/app/backend/data:ro

  # Celery worker - use production environment
  celery-worker:
    env_file: .env.production

  # Celery beat - use production environment
  celery-beat:
    env_file: .env.production

  # Optional: Adminer
  # You can comment this section out in prod if you don't want it exposed publicly
  adminer:
    # Example: only expose on a high, non-standard port if you really need it
    # or set ports: [] to hide it completely
    ports:
      - "8080:8080"

  # Frontend: Build on host BEFORE docker-compose up, not in container
  # frontend-build service removed - build locally with: cd frontend && npm run build

  # Caddy reverse proxy & static server
  caddy:
    image: caddy:2
    container_name: fire-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy config
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Serve built frontend from ./frontend/dist
      - ./frontend/dist:/srv
      # Caddy internal data/config
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend-build

volumes:
  caddy_data:
  caddy_config:
