services:
  # In prod, don't expose DB directly to the internet
  db:
    ports: null

  # Don't expose Redis either
  redis:
    ports: null

  # Backend should only be reachable internally by Caddy
  backend:
    env_file: .env.production
    ports: null

  # Celery worker - use production environment
  celery-worker:
    env_file: .env.production

  # Celery beat - use production environment
  celery-beat:
    env_file: .env.production

  # Optional: Adminer
  # You can comment this section out in prod if you don't want it exposed publicly
  adminer:
    # Example: only expose on a high, non-standard port if you really need it
    # or set ports: [] to hide it completely
    ports:
      - "8080:8080"

  # Build the frontend once (no Vite dev server in prod)
  frontend-build:
    image: node:20-alpine
    container_name: fire-frontend-build
    working_dir: /usr/src/app
    env_file: .env.production
    environment:
      DOCKER: "1"
    volumes:
      # Source code
      - ./frontend:/usr/src/app
      # Make sure built files also exist on the host in ./frontend/dist
      - ./frontend/dist:/usr/src/app/dist
    # Build once, then keep container alive
    command: sh -c "npm install && npm run build && tail -f /dev/null"
    depends_on:
      - backend

  # Caddy reverse proxy & static server
  caddy:
    image: caddy:2
    container_name: fire-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy config
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Serve built frontend from ./frontend/dist
      - ./frontend/dist:/srv
      # Caddy internal data/config
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend-build

volumes:
  caddy_data:
  caddy_config:
